name: Resumen Diario de Mercado

on:
  schedule:
    # 8:xx AM ET = 12:xx UTC (verano/EDT) o 13:xx UTC (invierno/EST).
    # Corren ambos crons; el script verifica la hora ET y solo envía cuando
    # es la hora 8 (así solo uno de los dos envía, según horario de verano).
    #
    # A los 12 minutos, NO en punto: GitHub congestiona y descarta las
    # corridas programadas al inicio de cada hora (lo advierte su propia
    # documentación), y a las 8:00 en punto no llegó. Correr desde el minuto
    # 12 esquiva esa congestión y deja ~47 min de margen si GitHub la retrasa.
    - cron: "12 12 * * 1-5"
    - cron: "12 13 * * 1-5"
  workflow_dispatch: # botón "Run workflow" para probar manualmente

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enviar resumen diario de mercado
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Alimenta noticias, earnings, macro e insiders. Sin esta clave
          # esas cuatro secciones se omiten y el correo manda solo los movers.
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # Destinatario — es dato personal, va como secret, no en el código.
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # En corrida manual, salta el chequeo de hora/feriado:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python3 scripts/premarket_email.py
