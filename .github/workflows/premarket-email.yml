name: Resumen Diario de Mercado

on:
  # Disparado por un temporizador externo (cron-job.org) vía la API de
  # GitHub, a una hora exacta antes de que abra el mercado. Los cron
  # PROGRAMADOS de GitHub gratis llegan con horas de retraso (se vio 5-6h);
  # un `workflow_dispatch` corre de inmediato, en segundos. Por eso ya no
  # hay bloque `schedule` — el reloj vive afuera.
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar envío aunque sea fin de semana o feriado (para probar)"
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enviar resumen diario de mercado
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Alimenta noticias, earnings, macro e insiders. Sin esta clave
          # esas cuatro secciones se omiten y el correo manda solo los movers.
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # Destinatario — es dato personal, va como secret, no en el código.
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # El empujón externo NO manda `force`, así que FORCE=0 y el script
          # respeta feriados (cron-job.org ya lo limita a lunes-viernes). El
          # botón manual sí puede marcar `force` para probar en cualquier día.
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python3 scripts/premarket_email.py
