name: Resumen Diario de Mercado

on:
  schedule:
    # UN solo cron: 12:12 UTC de lunes a viernes (~8:12 AM ET en verano,
    # ~7:12 AM ET en invierno). El script ya NO exige una hora exacta —
    # GitHub dispara los cron con retraso impredecible, así que se envía
    # cuando la corrida ocurra. Un solo cron evita enviar dos veces.
    # Al minuto 12 (no en punto) para esquivar la congestión de GitHub.
    - cron: "12 12 * * 1-5"
  workflow_dispatch: # botón "Run workflow" para probar manualmente

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enviar resumen diario de mercado
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Alimenta noticias, earnings, macro e insiders. Sin esta clave
          # esas cuatro secciones se omiten y el correo manda solo los movers.
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # Destinatario — es dato personal, va como secret, no en el código.
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # En corrida manual, salta el chequeo de hora/feriado:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python3 scripts/premarket_email.py
